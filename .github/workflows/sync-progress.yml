name: Sync progress

# Cada noche: Supabase → data/review_state.csv, para que Claude sepa qué llevo tiempo sin repasar.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC (03:17 en Madrid en invierno)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-progress
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    environment: Keys # los secrets de Supabase viven en este environment
    environment: Keys # los secrets de Supabase están en este environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exportar progreso
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/export_review_state.py
      - name: Commit si ha cambiado
        run: |
          if git diff --quiet --exit-code -- data/review_state.csv && git ls-files --error-unmatch data/review_state.csv >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_state.csv
          git commit -m "Progreso de repaso $(date -u +%F) [skip ci]"
          git push

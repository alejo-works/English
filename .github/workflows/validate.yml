name: Validate CSV

on:
  push:
    paths:
      - "data/**"
      - "scripts/validate_csv.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar data/*.csv
        run: python scripts/validate_csv.py
